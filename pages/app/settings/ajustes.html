<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctis – Ajustes</title>

    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/pages/ajustes.css">
</head>

<body>
    <main class="settings-page">

        <!-- HEADER -->
        <header class="settings-header">
            <a href="/pages/app/home/home.html" class="back-btn">
                <img src="/assets/icons/ui/arrow.svg" data-i18n-aria="common.back" alt="Volver">
            </a>
            <h1 data-i18n="settings.title">Ajustes</h1>
        </header>

        <!-- CONTENEDOR PRINCIPAL -->
        <section class="settings-layout">

            <!-- PANEL IZQUIERDO (SIDEBAR) -->
            <aside class="settings-sidebar">
                <div class="user-summary">
                    <div class="avatar-container">
                        <img id="userAvatar" src="/assets/avatars/avatar-luna.webp" alt="Avatar">
                    </div>
                    <h2 id="userName" data-i18n="common.loading">Cargando...</h2>
                </div>

                <div class="sidebar-divider"></div>

                <nav class="settings-nav">
                    <div class="nav-item" data-section="ubicacion" id="nav-ubicacion">
                        <img src="/assets/icons/ui/ubicaciónes/centro-urbano.svg" alt="">
                        <span data-i18n="settings.nav.location">Ubicación</span>
                    </div>
                    <div class="nav-item" data-section="idiomas" id="nav-idiomas">
                        <img src="/assets/icons/ui/idiomas.svg" alt="">
                        <span data-i18n="settings.nav.language">Idiomas</span>
                    </div>
                    <div class="nav-item" data-section="medidas" id="nav-medidas">
                        <img src="/assets/icons/ui/medidas.svg" alt="">
                        <span data-i18n="settings.nav.units">Medidas</span>
                    </div>
                    <div class="nav-item" data-section="hora" id="nav-hora">
                        <img src="/assets/icons/ui/clock.svg" alt="">
                        <span data-i18n="settings.nav.time">Hora</span>
                    </div>
                </nav>
            </aside>

            <!-- PANEL DERECHO (CONTENT) -->
            <div class="settings-content">
                <div class="glass-panel">

                    <!-- SECCIÓN IDIOMAS (Default) -->
                    <section id="section-idiomas" class="settings-section active">
                        <h2 data-i18n="settings.lang.title">Idiomas</h2>
                        <div class="setting-group">
                            <span class="group-label" data-i18n="settings.lang.label">Idioma de la aplicación</span>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="language" value="es" checked>
                                    <span class="radio-custom"></span>
                                    <span data-i18n="settings.lang.es">Español (España)</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="language" value="en">
                                    <span class="radio-custom"></span>
                                    <span data-i18n="settings.lang.en">Inglés (English)</span>
                                </label>
                            </div>
                        </div>
                        <div class="section-footer">
                            <button class="btn-save" id="save-idiomas" data-i18n="settings.lang.save">Guardar cambios</button>
                        </div>
                    </section>

                    <!-- SECCIÓN UBICACIÓN -->
                    <section id="section-ubicacion" class="settings-section">
                        <h2 data-i18n="settings.location.title">Ubicación</h2>
                        <div class="location-info">
                            <p class="location-name" id="display-location" data-i18n="common.loading">Cargando...</p>
                            <p class="location-coords" id="display-coords">--°--'--"-- N --°--'--"-- O</p>
                        </div>
                    </section>

                    <!-- SECCIÓN MEDIDAS -->
                    <section id="section-medidas" class="settings-section">
                        <h2 data-i18n="settings.units.title">Medidas</h2>

                        <div class="setting-group">
                            <span class="group-label" data-i18n="settings.units.distance">Distancia</span>
                            <div class="radio-row">
                                <label class="radio-label">
                                    <input type="radio" name="distance" value="km" checked>
                                    <span class="radio-custom"></span>
                                    <span data-i18n="settings.units.km">Kilómetros</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="distance" value="mi">
                                    <span class="radio-custom"></span>
                                    <span data-i18n="settings.units.mi">Millas</span>
                                </label>
                            </div>
                        </div>

                        <div class="divider-line"></div>

                        <div class="setting-group">
                            <span class="group-label" data-i18n="settings.units.temp">Temperatura</span>
                            <div class="radio-row">
                                <label class="radio-label">
                                    <input type="radio" name="temp" value="c" checked>
                                    <span class="radio-custom"></span>
                                    °C (Celsius)
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="temp" value="f">
                                    <span class="radio-custom"></span>
                                    °F (Fahrenheit)
                                </label>
                            </div>
                        </div>

                        <button class="btn-secondary" id="reset-defaults" data-i18n="settings.units.reset">Restablecer valores recomendados para España</button>

                        <div class="section-footer">
                            <button class="btn-save" id="save-medidas" data-i18n="settings.units.save">Guardar Cambios</button>
                        </div>
                    </section>

                    <!-- SECCIÓN HORA -->
                    <section id="section-hora" class="settings-section">
                        <h2 data-i18n="settings.time.title">Hora</h2>

                        <div class="setting-group">
                            <span class="group-label" data-i18n="settings.time.timezone">Zona horaria</span>
                            <p class="timezone-text">UTC +1 / UTC +2 (Europe/Madrid)</p>
                        </div>

                        <div class="divider-line"></div>

                        <div class="setting-group flex-row">
                            <span class="group-label" data-i18n="settings.time.auto">Hora automática</span>
                            <label class="switch">
                                <input type="checkbox" id="auto-time" checked>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="radio-group mt-20">
                            <label class="radio-label">
                                <input type="radio" name="time-format" value="24" checked>
                                <span class="radio-custom"></span>
                                <span data-i18n="settings.time.h24">24 Horas</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="time-format" value="12">
                                <span class="radio-custom"></span>
                                <span data-i18n="settings.time.h12">12 Horas</span>
                            </label>
                        </div>

                        <div class="section-footer">
                            <button class="btn-save" id="save-hora" data-i18n="settings.time.save">Guardar cambios</button>
                        </div>
                    </section>

                    <div id="msg" class="feedback"></div>

                </div>
            </div>

        </section>

    </main>

    <script type="module" src="/js/pages/ajustes.js"></script>
</body>

</html>
