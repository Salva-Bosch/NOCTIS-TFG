<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctis | Favoritos</title>

    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/components/navbar.css">
    <link rel="stylesheet" href="/css/pages/favoritos.css">
</head>

<body>
    <main class="favorites-page">
        <header class="favorites-header">
            <h1 data-i18n="favorites.title">Favoritos</h1>
        </header>

        <section class="search-container">
            <div class="search-wrapper">
                <img src="/assets/icons/nav/search.svg" alt="Buscar" class="search-icon">
                <input type="text" id="searchFavorites" data-i18n-placeholder="favorites.search" placeholder="Buscar en favoritos..." autocomplete="off">
            </div>
        </section>

        <section id="favoritesList" class="favorites-list">
            <!-- Los favoritos se inyectan via JS -->
            <div class="empty-state">
                <p data-i18n="favorites.empty">Aún no tienes favoritos seleccionados.</p>
            </div>
        </section>
    </main>

    <!-- Menú lateral de Noctis -->
    <script type="module">
        import { loadSideNav } from "/js/core/loadSideNav.js";
        import { requireSession } from "/js/guards/sessionGuard.js";
        import { initI18n } from "/js/core/i18n.js";

        await requireSession();
        await loadSideNav();
        await initI18n();
    </script>

    <script type="module" src="/js/pages/favoritos.js"></script>
</body>

</html>
