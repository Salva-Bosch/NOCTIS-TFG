<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctis · Acceso</title>

    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/components/auth-base.css">
    <link rel="stylesheet" href="../../css/components/auth.css">
</head>

<body>

    <main class="auth auth--login" id="auth">

        <!-- FORM -->
        <section class="auth__form">

            <!-- MOBILE HEADER (TABS) -->
            <div class="auth-mobile-header" aria-hidden="true">
                <img src="../../assets/branding/logo/noctis-logo.webp" alt="Noctis" class="mobile-logo">
                <div class="auth-tabs">
                    <button class="tab-btn active" data-target="login" type="button" data-i18n="auth.mobile.tab_login" aria-label="Tab Iniciar Sesión">Iniciar sesión</button>
                    <button class="tab-btn" data-target="register" type="button" data-i18n="auth.mobile.tab_register" aria-label="Tab Registro">Registrarse</button>
                </div>
            </div>

            <!-- LOGIN -->
            <div class="auth-panel auth-panel--login active">
                <h1 data-i18n="auth.login.title">Iniciar sesión</h1>

                <form id="login-form">
                    <div class="input-group has-icon">
                        <img src="../../assets/icons/auth/user.svg" class="input-icon icon-default" alt="">
                        <img src="../../assets/icons/auth/user-active.svg" class="input-icon icon-active" alt="">
                        <input type="email" data-i18n-placeholder="auth.login.email" placeholder="Correo electrónico"
                            required>
                    </div>

                    <div class="input-group has-icon">
                        <img src="../../assets/icons/auth/lock.svg" class="input-icon icon-default" alt="">
                        <img src="../../assets/icons/auth/lock-active.svg" class="input-icon icon-active" alt="">
                        <input type="password" data-i18n-placeholder="auth.login.password" placeholder="Contraseña"
                            required>
                    </div>

                    <button type="submit" data-i18n="auth.login.btn">Login</button>
                </form>

                <div class="auth-divider">
                    <span data-i18n="auth.login.google">O accede con Google</span>
                </div>

                <button class="google-btn" type="button" aria-label="Acceder con Google">
                    <img src="../../assets/social/networks/google.svg" alt="Google">
                </button>

            </div>

            <!-- REGISTER -->
            <div class="auth-panel auth-panel--register">
                <h1 data-i18n="auth.register.title">Regístrate</h1>

                <form id="register-form">
                    <div class="input-group has-icon">
                        <img src="../../assets/icons/auth/user.svg" class="input-icon icon-default" alt="">
                        <img src="../../assets/icons/auth/user-active.svg" class="input-icon icon-active" alt="">
                        <input type="text" data-i18n-placeholder="auth.register.name" placeholder="Nombre" required>
                    </div>

                    <div class="input-group has-icon">
                        <img src="../../assets/icons/auth/user.svg" class="input-icon icon-default" alt="">
                        <img src="../../assets/icons/auth/user-active.svg" class="input-icon icon-active" alt="">
                        <input type="email" data-i18n-placeholder="auth.register.email" placeholder="Correo electrónico"
                            required>
                    </div>

                    <div class="input-group has-icon">
                        <img src="../../assets/icons/auth/lock.svg" class="input-icon icon-default" alt="">
                        <img src="../../assets/icons/auth/lock-active.svg" class="input-icon icon-active" alt="">
                        <input type="password" data-i18n-placeholder="auth.register.password" placeholder="Contraseña"
                            required>
                    </div>

                    <button type="submit" data-i18n="auth.register.btn">Crear cuenta</button>
                </form>

                <div class="auth-divider">
                    <span data-i18n="auth.register.google">O accede con Google</span>
                </div>

                <button class="google-btn" type="button" aria-label="Acceder con Google">
                    <img src="../../assets/social/networks/google.svg" alt="Google">
                </button>

            </div>

        </section>

        <!-- SIDE -->
        <section class="auth__side">
            <img src="../../assets/branding/logo/noctis-logo.webp" class="logo-auth">

            <h2 id="side-title" data-i18n="auth.side.hello">¡Hola!</h2>
            <p id="side-text" data-i18n="auth.side.create">Crea tu cuenta</p>

            <a href="#" id="toggle-auth" data-i18n="auth.side.link">Registrarte</a>
        </section>

    </main>

    <!-- SCRIPT ANIMACIÓN -->
    <script src="../../js/core/animations/auth-simple-transition.js"></script>

    <!-- SCRIPT AUTH FIREBASE -->
    <script type="module" src="../../js/pages/auth.js"></script>

    <!-- i18n -->
    <script type="module">
        import { initI18n } from '/js/core/i18n.js';
        initI18n();
    </script>

</body>

</html>
